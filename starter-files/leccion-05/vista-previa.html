<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Práctica de desarrollo web</title>
  <style>

body {
  background-color: #eaf3ff;
  color: #18253a;
  font-family: Arial, sans-serif;
  line-height: 1.6;
}

.tarjeta {
  max-width: 640px;
  margin: 30px auto;
  padding: 24px;
  background-color: white;
  border: 2px solid #cbd5e1;
  border-radius: 16px;
}

h1 {
  color: #216bde;
}

img {
  max-width: 100%;
  height: auto;
  border-radius: 12px;
}

a {
  color: #1550a9;
}

  </style>
</head>
<body>
<main class="tarjeta">
  <h1>¡Hola! Soy Alex</h1>
  <p>Estudiante que disfruta crear cosas.</p>

  <section>
    <h2>Sobre mí</h2>
    <p>Me gustan el arte y la tecnología.</p>
  </section>

  <section>
    <h2>Mis pasatiempos</h2>
    <ul>
      <li>Escuchar música</li>
      <li>Dibujar</li>
      <li>Explorar la ciencia</li>
    </ul>
  </section>

  <section>
    <h2>Una imagen de ejemplo</h2>
    <img src="https://placehold.co/640x360/png?text=Mi+pasatiempo"
         alt="Ilustración de ejemplo con el texto Mi pasatiempo">
    <p>
      <a href="https://developer.mozilla.org/es/">
        Aprender más sobre desarrollo web
      </a>
    </p>
  </section>
</main>

</body>
</html>
