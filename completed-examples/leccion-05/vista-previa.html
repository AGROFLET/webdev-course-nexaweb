<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Práctica de desarrollo web</title>
  <style>
/* Estilos generales */
body {
  margin: 0;
  padding: 24px;
  background-color: #eaf3ff;
  color: #18253a;
  font-family: Arial, sans-serif;
  line-height: 1.6;
}

.tarjeta {
  max-width: 640px;
  margin: 28px auto;
  padding: 28px;
  background-color: #ffffff;
  border: 2px solid #cbd5e1;
  border-radius: 18px;
}

.encabezado {
  padding-bottom: 12px;
  border-bottom: 1px solid #cbd5e1;
}

h1 {
  margin-bottom: 6px;
  color: #0d9488;
}

h2 {
  margin-top: 26px;
  color: #216bde;
}

.subtitulo {
  margin-top: 0;
  font-weight: bold;
}

img {
  max-width: 100%;
  height: auto;
  border-radius: 12px;
}

a {
  color: #1550a9;
}

a:hover {
  text-decoration: none;
}

  </style>
</head>
<body>
<main class="tarjeta">
  <header class="encabezado">
    <h1>¡Hola! Soy Sam</h1>
    <p class="subtitulo">Mi primera página web</p>
    <p>Me gusta aprender, crear y compartir ideas.</p>
  </header>

  <section>
    <h2>Sobre mí</h2>
    <p>Estoy aprendiendo HTML y CSS paso a paso.</p>
  </section>

  <section>
    <h2>Mis pasatiempos</h2>
    <ul>
      <li>Crear animaciones</li>
      <li>Tocar guitarra</li>
      <li>Programar minijuegos</li>
    </ul>
  </section>

  <section>
    <h2>Una imagen de ejemplo</h2>
    <img src="https://placehold.co/640x360/png?text=Mi+pasatiempo"
         alt="Ilustración de ejemplo con el texto Mi pasatiempo">
  </section>

  <footer>
    <a href="https://developer.mozilla.org/es/">
      Sigue aprendiendo sobre desarrollo web
    </a>
  </footer>
</main>

</body>
</html>
